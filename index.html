<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crypto Hack | Economie hoofdstuk 1 en 2</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial;background:#0b1025;color:#f7f9ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#223568,#0b1025 75%)}main{max-width:940px;margin:auto;padding:30px 16px}h1{font-size:clamp(32px,6vw,60px);margin:6px 0 10px}h2{margin:0 0 18px}.muted{color:#b8c7eb}.gold{color:#ffd25a}.panel{background:#19264a;border:1px solid #425889;border-radius:20px;padding:24px;margin:18px 0;box-shadow:0 12px 30px #0004}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hide{display:none!important}button,input,select{font:inherit}button{background:#ffd25a;color:#14203e;border:0;border-radius:12px;padding:14px 19px;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:default}.secondary,.option{background:#324a89;color:#fff}.option{min-height:80px;text-align:left}.option:hover:not(:disabled){background:#4663aa}.boxpick{min-height:130px;font-size:28px;background:linear-gradient(140deg,#314b99,#543c94);color:white}.boxpick:hover{filter:brightness(1.2)}input,select{padding:13px;border-radius:11px;border:1px solid #7186bc;background:#0e1b3e;color:white;max-width:100%}.stat{padding:10px 15px;border-radius:12px;background:#101c3c}.big{font-size:28px;font-weight:900}.leader{display:flex;justify-content:space-between;border-bottom:1px solid #40527d;padding:10px 0;gap:8px}.notice{color:#ffb6b6}.good{color:#87f2b6}.bad{color:#ffb6b6}.pill{background:#2a3b69;border-radius:20px;padding:6px 12px}.bar{height:8px;background:#101c3c;border-radius:12px;overflow:hidden;margin:16px 0}.bar>div{background:#ffd25a;height:100%}label{display:block;margin:10px 0}.code{font-size:23px;font-weight:800;letter-spacing:2px}.tag{display:inline-block;background:#263e74;border-radius:9px;padding:9px 12px;margin:5px}.animal-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}.animal-choice{font-size:27px;background:#253c73;color:white;padding:9px 11px;border:2px solid transparent;min-width:52px}.animal-choice.selected{border-color:#ffd25a;background:#405da0;box-shadow:0 0 0 2px #ffd25a44}.hero{text-align:center;padding:25px 0 8px}.hero p{margin:0}.center{text-align:center}@media(max-width:620px){.grid{grid-template-columns:1fr}.panel{padding:17px}}
</style></head><body><main><header class="hero"><div class="gold">ECONOMIE • KADER</div><h1>Crypto Hack</h1><p class="muted">Hoofdstuk 1 en 2</p></header>
<section class="panel" id="home"><h2>Welkom!</h2><div class="row"><button id="teacherBtn">Docent</button><button id="studentBtn" class="secondary">Leerling</button></div><div id="teacherForm" class="hide"><h3>Nieuw spel</h3><label>Speeltijd <select id="duration"></select></label><button id="createBtn">Maak gamecode</button></div><div id="studentForm" class="hide"><h3>Doe mee</h3><label>Gamecode <input id="pin" placeholder="6 cijfers" inputmode="numeric" maxlength="6"></label><label>Voornaam <input id="name" placeholder="Je voornaam" maxlength="24" autocomplete="given-name"></label><label>Kies jouw dier 🐾</label><div class="animal-grid" id="animalChoices"></div><button id="joinBtn">Meespelen</button></div><p id="notice" class="notice"></p></section>
<section class="panel hide" id="teacher"><div class="row spread"><div><h2>Docent</h2><p>Gamecode: <strong class="gold big" id="gamecode"></strong></p><p class="muted" id="joinLink"></p></div><div class="stat">⏱ <span class="big" id="teacherTime">--:--</span></div></div><div class="row"><button id="startBtn">Start spel</button><button id="endBtn" class="secondary">Stop spel</button></div><p id="teacherStatus" class="muted"></p><h3>Ranglijst</h3><div id="teacherBoard"></div></section>
<section class="panel hide" id="player"><div class="row spread"><div><h2 id="greeting"></h2><div id="stats" class="muted"></div></div><div class="stat">⏱ <span class="big" id="playerTime">--:--</span></div><div class="stat">₿ <span class="big gold" id="coins">1000</span></div></div><div id="myCodes"></div><div class="bar"><div id="progress" style="width:0%"></div></div><div id="playArea"></div><h3>Ranglijst</h3><div id="playerBoard"></div></section>
</main><script>
const QUESTIONS=[{"q": "Wat zijn middelen?", "options": ["Alleen je spaargeld", "Alle gratis goederen", "Alleen producten in winkels", "Dingen zoals geld en tijd om behoeften te vervullen"], "correct": 3}, {"q": "Wat is een primaire behoefte?", "options": ["Voedsel", "Een merktrui", "Een vakantie", "Een gameconsole"], "correct": 0}, {"q": "Wat is een secundaire behoefte?", "options": ["Een nieuwe spelcomputer", "Drinkwater", "Een veilige woning", "Basisvoedsel"], "correct": 0}, {"q": "Waarom stel je prioriteiten?", "options": ["Omdat behoeften nooit veranderen", "Omdat geld onbeperkt is", "Omdat je niet alles tegelijk kunt betalen", "Omdat alle producten even duur zijn"], "correct": 2}, {"q": "Wat betekent schaarste in economie?", "options": ["Er zijn maar tien stuks", "Een product is gratis", "Een product is altijd uitverkocht", "Er zijn middelen nodig om een product te maken"], "correct": 3}, {"q": "Hoe noem je goederen waarvoor geen schaarse middelen nodig zijn?", "options": ["Kapitaalgoederen", "Consumptiegoederen", "Vrije goederen", "Luxe goederen"], "correct": 2}, {"q": "Welke keuze is een voorbeeld van zelfvoorziening?", "options": ["Een abonnement afsluiten", "Een pizza bestellen", "Zelf groenten verbouwen", "Een jas kopen"], "correct": 2}, {"q": "Wat is consumeren?", "options": ["Goederen en diensten gebruiken om behoeften te vervullen", "Belasting betalen", "Alleen geld sparen", "Alleen produceren voor verkoop"], "correct": 0}, {"q": "Welke factor kan je koopgedrag beïnvloeden?", "options": ["Alleen het weer", "Reclame van influencers", "Je banksaldo nooit", "Niets, koopgedrag staat vast"], "correct": 1}, {"q": "Waarom verandert koopgedrag soms?", "options": ["Omdat reclame verboden is", "Omdat prijzen nooit veranderen", "Door een verandering in inkomen of smaak", "Omdat iedereen hetzelfde wil"], "correct": 2}, {"q": "Waarom zijn jongeren interessant voor bedrijven?", "options": ["Ze kopen nooit online", "Ze kopen zelf en beïnvloeden aankopen thuis", "Ze hebben altijd een hoog salaris", "Ze betalen geen prijzen"], "correct": 1}, {"q": "Wat is informatieve reclame?", "options": ["Reclame die altijd van de overheid komt", "Reclame zonder informatie", "Reclame die productkenmerken uitlegt", "Reclame die alleen gevoelens oproept"], "correct": 2}, {"q": "Welke reclame probeert vooral een gevoel op te roepen?", "options": ["Sfeervolle reclame", "Een handleiding", "Een kassabon", "Een prijslijst"], "correct": 0}, {"q": "Welke P van marketing gaat over hoeveel iets kost?", "options": ["Personeel", "Product", "Plaats", "Prijs"], "correct": 3}, {"q": "Welke P gaat over waar je iets kunt kopen?", "options": ["Presentatie", "Prijs", "Promotie", "Plaats"], "correct": 3}, {"q": "Welke P gaat over advertenties en acties?", "options": ["Promotie", "Product", "Personeel", "Plaats"], "correct": 0}, {"q": "Welke P gaat over de eigenschappen van wat je verkoopt?", "options": ["Product", "Prijs", "Plaats", "Promotie"], "correct": 0}, {"q": "Welke P gaat over de medewerkers in een winkel?", "options": ["Prijs", "Plaats", "Product", "Personeel"], "correct": 3}, {"q": "Welke P gaat over de uitstraling en inrichting van de winkel?", "options": ["Product", "Personeel", "Presentatie", "Prijs"], "correct": 2}, {"q": "Wat doet een consumentenorganisatie?", "options": ["Zelf belasting heffen", "Consumenten informeren en hun belangen behartigen", "Alle prijzen bepalen", "Bankbiljetten drukken"], "correct": 1}, {"q": "Welke bron is meestal handig om producten eerlijk te vergelijken?", "options": ["Alleen de reclame van het merk", "Een anonieme advertentie", "Een onafhankelijke producttest", "Alleen de verpakking"], "correct": 2}, {"q": "Wat is een mogelijk gevolg van je aankoop voor het milieu?", "options": ["Meer afval en CO₂-uitstoot", "Altijd minder energiegebruik", "Geen enkel gevolg", "Altijd minder vervoer"], "correct": 0}, {"q": "Waarvoor helpt een keurmerk?", "options": ["Om eigenschappen zoals duurzaamheid te herkennen", "Om elk product gratis te maken", "Om betalen overbodig te maken", "Om alle prijzen gelijk te maken"], "correct": 0}, {"q": "Wat is inkomen uit arbeid?", "options": ["Loon voor je werk", "Rente op spaargeld", "Een gewonnen prijs", "Kinderbijslag"], "correct": 0}, {"q": "Wat is inkomen uit bezit?", "options": ["Studiefinanciering", "Rente over spaargeld", "Salaris", "Bijstand"], "correct": 1}, {"q": "Wat is een overdrachtsinkomen?", "options": ["Winst uit je winkel", "Een uitkering", "Loon uit een bijbaan", "Huurinkomsten"], "correct": 1}, {"q": "Welke factor kan inkomensverschillen verklaren?", "options": ["Iedereen werkt evenveel uren", "Iedereen heeft dezelfde baan", "Alle lonen zijn wettelijk gelijk", "Verschil in opleiding en werkervaring"], "correct": 3}, {"q": "Wat betekent welvaart?", "options": ["Alleen je gezondheid", "De mate waarin je behoeften met middelen kunt vervullen", "Alleen hoe gelukkig je bent", "Het aantal vrienden dat je hebt"], "correct": 1}, {"q": "Wat betekent welzijn?", "options": ["Hoe goed je je voelt en hoe prettig je leeft", "Alleen hoeveel geld je bezit", "Alleen je spaarrente", "Alleen je maandloon"], "correct": 0}, {"q": "Welke uitgave is een vaste last?", "options": ["Maandelijkse huur", "Een ijsje", "Een bioscoopkaartje", "Een nieuwe trui"], "correct": 0}, {"q": "Welke uitgave is een dagelijkse uitgave?", "options": ["Een nieuwe wasmachine", "Boodschappen", "Jaarlijkse vakantie", "Een auto kopen"], "correct": 1}, {"q": "Welke uitgave is een incidentele uitgave?", "options": ["Een nieuwe fiets", "Maandelijks internetabonnement", "De maandelijkse huur", "Wekelijkse boodschappen"], "correct": 0}, {"q": "Wat betekent budgetteren?", "options": ["Altijd contant betalen", "Alleen lenen", "Zonder nadenken geld uitgeven", "Je inkomsten en uitgaven plannen"], "correct": 3}, {"q": "Wat staat normaal op de linkerkant van een begroting?", "options": ["Schulden van de bank", "Uitgaven", "Inkomsten", "Alleen spaargeld"], "correct": 2}, {"q": "Wat kun je doen bij een tekort op je begroting?", "options": ["Je inkomsten negeren", "Minder uitgeven of extra verdienen", "Meer uitgeven", "Altijd duurder lenen"], "correct": 1}, {"q": "Welke kosten horen bij autorijden?", "options": ["Brandstof, verzekering, belasting en onderhoud", "Alleen parkeren", "Alleen aanschafprijs", "Alleen benzine"], "correct": 0}, {"q": "Welke geldfunctie gebruik je als je in de winkel afrekent?", "options": ["Rekeneenheid", "Ruilmiddel", "Beleggingsrisico", "Spaarmiddel"], "correct": 1}, {"q": "Welke geldfunctie gebruik je om prijzen te vergelijken?", "options": ["Leenmiddel", "Ruilmiddel", "Kredietmiddel", "Rekeneenheid"], "correct": 3}, {"q": "Wat is chartaal geld?", "options": ["Geld op je betaalrekening", "Een bankoverschrijving", "Een pinbetaling", "Munten en bankbiljetten"], "correct": 3}, {"q": "Wat is giraal geld?", "options": ["Goud in een kluis", "Alleen bankbiljetten", "Geld op bankrekeningen", "Alleen munten"], "correct": 2}, {"q": "Wat probeert de ECB met haar rentebeleid te bewaken?", "options": ["Prijsstabiliteit van de euro", "Dat alle producten gratis worden", "Dat niemand meer spaart", "Dat iedereen evenveel verdient"], "correct": 0}, {"q": "Welk spaarmotief hoort bij sparen voor een onverwachte reparatie?", "options": ["Vermogensmotief", "Leenmotief", "Voorzorgsmotief", "Doelmotief"], "correct": 2}, {"q": "Wat is een spaardeposito?", "options": ["Een lening voor een huis", "Spaargeld dat je voor een afgesproken tijd vastzet", "Contant geld in je portemonnee", "Een betaalpas"], "correct": 1}, {"q": "Wat gebeurt er met de koopkracht van spaargeld bij inflatie, zonder voldoende rente?", "options": ["Die blijft altijd gelijk", "Die daalt", "Die verdubbelt", "Die stijgt altijd"], "correct": 1}, {"q": "Wat is een voorbeeld van beleggen?", "options": ["Contant afrekenen", "Geld op je betaalrekening laten staan", "Aandelen kopen", "Een kassabon bewaren"], "correct": 2}, {"q": "Wat is een hypothecaire lening?", "options": ["Een gewone pinbetaling", "Een vorm van salaris", "Een lening met een woning als onderpand", "Een lening zonder rente"], "correct": 2}];
const $=id=>document.getElementById(id),escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ANIMALS=['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐧','🐦','🦄','🐢','🐙','🦋','🐝','🦉','🐺'];
let chosenAnimal='🐶';
const animalContainer=document.getElementById('animalChoices');
for(const animal of ANIMALS){const btn=document.createElement('button');btn.type='button';btn.className='animal-choice'+(animal===chosenAnimal?' selected':'');btn.textContent=animal;btn.setAttribute('aria-label','Kies '+animal);btn.setAttribute('aria-pressed',String(animal===chosenAnimal));btn.onclick=()=>{chosenAnimal=animal;for(const b of animalContainer.children){b.classList.toggle('selected',b===btn);b.setAttribute('aria-pressed',String(b===btn))}};animalContainer.appendChild(btn)}
let role='',pin='',token='',state=null,position=0,cycle=1,order=shuffle(QUESTIONS.map((_,i)=>i)),current=null,locked=false,freezeUntil=0,stage='waiting',poll=null,interval=null;
for(let i=1;i<=15;i++)$('duration').add(new Option(i+' '+(i===1?'minuut':'minuten'),i,i===10,i===10));
$('teacherBtn').onclick=()=>{$('teacherForm').classList.remove('hide');$('studentForm').classList.add('hide')};$('studentBtn').onclick=()=>{$('studentForm').classList.remove('hide');$('teacherForm').classList.add('hide')};
function show(x){for(let id of ['home','teacher','player'])$(id).classList.toggle('hide',id!==x)}
async function api(route,data){let r=await fetch('/api/'+route,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});let j=await r.json();if(!r.ok)throw Error(j.error||'Er ging iets mis');return j}
function error(e){alert(e.message||String(e))}
$('createBtn').onclick=async()=>{try{let r=await api('create',{duration:Number($('duration').value)});role='teacher';pin=r.pin;token=r.token;$('gamecode').textContent=pin;$('joinLink').textContent='Leerlingen openen: '+location.origin;show('teacher');startPolling();refresh()}catch(e){error(e)}};
$('joinBtn').onclick=async()=>{try{let name=$('name').value.trim();let r=await api('join',{pin:$('pin').value.trim(),name,animal:chosenAnimal});role='player';pin=r.pin;token=r.token;$('greeting').textContent='Hoi '+r.animal+' '+name+'!';$('myCodes').innerHTML='<p class="muted">Jouw 3 geheime codes (houd ze voor jezelf):</p>'+r.codes.map(c=>'<span class="tag code">'+c+'</span>').join('');show('player');startPolling();refresh()}catch(e){$('notice').textContent=e.message}};
$('startBtn').onclick=async()=>{try{await api('start',{pin,token});refresh()}catch(e){error(e)}};
$('endBtn').onclick=async()=>{if(!confirm('Spel stoppen?'))return;try{await api('end',{pin,token});refresh()}catch(e){error(e)}};
function remaining(){if(!state||state.phase==='lobby')return '--:--';let s=Math.max(0,Math.ceil((state.endsAt-Date.now())/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function board(list){return list.length?list.map((p,i)=>'<div class="leader"><span>'+(i+1)+'. '+escapeHtml(p.animal||'🐾')+' '+escapeHtml(p.name)+'</span><span class="gold">₿ '+p.coins+' <small class="muted">('+p.completed+' vragen)</small></span></div>').join(''):'<p class="muted">Nog geen leerlingen</p>'}
async function refresh(){if(!role)return;try{state=await api('state?pin='+encodeURIComponent(pin)+'&token='+encodeURIComponent(token));if(state.phase==='running'&&Date.now()>=state.endsAt)state.phase='finished';if(role==='teacher'){$('teacherTime').textContent=remaining();$('startBtn').disabled=state.phase!=='lobby';$('teacherStatus').textContent=state.phase==='lobby'?'Wachten op leerlingen.':state.phase==='running'?'Leerlingen spelen op eigen tempo.':'Spel afgelopen.';$('teacherBoard').innerHTML=board(state.players)}else{$('playerTime').textContent=remaining();$('coins').textContent=state.me.coins;$('stats').textContent=state.me.completed+' vragen beantwoord';$('playerBoard').innerHTML=board(state.players);if(state.phase==='lobby'){$('playArea').innerHTML='<h3>Wachten op de docent…</h3>'}else if(state.phase==='finished'){stage='finished';current=null;$('playArea').innerHTML='<h2>De tijd is voorbij!</h2><p>Je eindscore: ₿ '+state.me.coins+'</p>'}else if(stage==='freeze'){if(state.me.frozenUntil)freezeUntil=state.me.frozenUntil;renderFreeze()}else if(stage==='waiting'){nextQuestion()}}}catch(e){console.warn(e.message)}}
function startPolling(){if(poll)clearInterval(poll);if(interval)clearInterval(interval);poll=setInterval(refresh,2500);interval=setInterval(()=>{if(!state)return;let t=remaining();$('teacherTime').textContent=t;$('playerTime').textContent=t;if(state.phase==='running'&&Date.now()>=state.endsAt){state.phase='finished';refresh()}else if(stage==='freeze')renderFreeze()},250)}
function nextQuestion(){if(!state||state.phase!=='running'||Date.now()<freezeUntil)return;if(position>=QUESTIONS.length){position=0;cycle++;order=shuffle(QUESTIONS.map((_,i)=>i))}let q=QUESTIONS[order[position]];current=q;locked=false;stage='question';$('progress').style.width=(position/QUESTIONS.length*100)+'%';$('playArea').innerHTML='<p class="gold">RONDE '+cycle+' · VRAAG '+(position+1)+' / '+QUESTIONS.length+'</p><h2>'+escapeHtml(q.q)+'</h2><div class="grid" id="answers"></div><div id="feedback"></div>';for(let i of shuffle([0,1,2,3])){let b=document.createElement('button');b.className='option';b.textContent=q.options[i];b.onclick=()=>answer(i);$('answers').appendChild(b)}}
function renderFreeze(){if(stage!=='freeze')return;if(!state||state.phase!=='running'||Date.now()>=state.endsAt){refresh();return}let left=Math.max(0,Math.ceil((freezeUntil-Date.now())/1000));if(left<=0){stage='waiting';position++;current=null;nextQuestion();return}$('playArea').innerHTML='<h2 class="bad">❄️ Fout antwoord!</h2><p>Je kunt 7 seconden niets doen. Geen cadeautje deze beurt.</p><div class="big">Nog '+left+' seconden</div><p class="muted">Juiste antwoord: '+escapeHtml(current.options[current.correct])+'</p>'}
async function answer(choice){if(locked||stage!=='question'||!state||state.phase!=='running'||Date.now()>=state.endsAt)return;locked=true;try{let r=await api('answer',{pin,token,question:order[position],cycle,choice});if(!r.ok){stage='freeze';freezeUntil=r.frozenUntil;renderFreeze();refresh();return}stage='box';$('playArea').innerHTML='<h2 class="good">Goed! +500 crypto</h2><h3>Kies één vakje</h3><div class="grid" id="boxes"></div>';for(let i=0;i<4;i++){let b=document.createElement('button');b.className='boxpick';b.textContent='🎁';b.setAttribute('aria-label','Vakje '+(i+1));b.onclick=()=>pickBox(i);$('boxes').appendChild(b)}refresh()}catch(e){locked=false;error(e)}}
async function pickBox(i){if(stage!=='box')return;stage='loading';try{let r=await api('box',{pin,token,box:i});if(r.type==='hack'&&!r.noTarget){stage='hack';$('playArea').innerHTML='<h2>🔓 Hack!</h2><p>Je willekeurige doelwit is <strong>'+escapeHtml(r.target)+'</strong>.</p><p>Kies de juiste geheime code:</p><div class="grid" id="guesses"></div>';for(let code of r.choices){let b=document.createElement('button');b.className='option';b.textContent=code;b.onclick=()=>guess(code);$('guesses').appendChild(b)}}else{let label=r.type==='hack'?'Geen andere speler om te hacken':r.type==='bonus'?'+1000 crypto':r.type==='double'?'Je crypto is verdubbeld! +'+r.gained:'Je crypto is verdrievoudigd! +'+r.gained;finishReward(label)}refresh()}catch(e){stage='box';error(e)}}
async function guess(c){if(stage!=='hack')return;stage='loading';try{let r=await api('guess',{pin,token,guess:c});finishReward(r.success?'Hack gelukt! ₿ '+r.stolen+' gestolen.':'Hack mislukt!');refresh()}catch(e){stage='hack';error(e)}}
function finishReward(label){stage='reward';$('playArea').innerHTML='<h2 class="gold">'+escapeHtml(label)+'</h2><button id="nextBtn">Volgende vraag →</button>';$('nextBtn').onclick=()=>{position++;current=null;stage='waiting';nextQuestion()}}
</script></body></html>
